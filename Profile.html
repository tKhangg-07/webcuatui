<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Cá Nhân</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #3c90a5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(219, 177, 177, 0.815);
            text-align: center;
        }
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007bff;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 20px;
        }
        .info-section  {
            text-align: left;
            margin-bottom: 20px;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding 15px 0;
        }
        .info-section p {
            margin: 8px 0;
            color: #444;
        }
        .info-section strong {
            color: #111;
            width: 130px;
            display: inline-block;
        }
        .hobbies {
            text-align: left;
            margin-bottom: 20px;
        }
        .hobbies h3 {
            color: #007bff;
            margin-bottom: 10px;
        }
        .hobbies ul {
            margin: 0;
            padding-left: 20px;
            color: #FF0000;
        }
        .social-links a:hover {
            background: #c88484;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="Ảnh đại diện.jpg" alt="Ảnh cá nhân" class="avatar">
        <h1>Nguyễn Vũ Tấn Khang</h1>
        <p class="subtitle">Sinh viên ngành công nghệ thông tin</p>

        <div class="info-section">
            <p><strong>MSSV</strong>241A010156</p>
            <p><strong>Lớp</strong>26INT440708</p>
            <p><strong>Ngày sinh</strong>07/01/2006</p>
            <p><strong>Quê quán</strong>Thành phố Đồng Nai</p>
            <p><strong>SĐT</strong>0916082106</p>
        </div>

        <div class="hobbies">
            <h3>Sở thích cá nhân</h3>
            <ul>
                <li>Đi du lịch</li>
                <li>Đi Đà Lạt healing</li>
                <li>Chơi game</li>
            </ul>
        </div>

        <div class="social-links">
            <h3>Mạng xã hội</h3>
            <a href="https://www.instagram.com/_tannkhanng_?mdxt=MTF2ZmRlazZpbnE5eg%3D%3D&utm_source=qr" target="_blank">Instagram</a>
            <a href="https://www.tiktok.com/@tkhangg_0701" target="_blank">TikTok</a>
        </div>
    </div>
</body>
</html>
